apiVersion: v1
kind: Namespace
metadata:
  name: databridge
---
apiVersion: v1
kind: Secret
metadata:
  name: databridge-auth
  namespace: databridge
type: Opaque
stringData:
  DATABRIDGE_AUTH_USER: admin
  # Replace before applying in production:
  #   openssl rand -base64 24
  DATABRIDGE_AUTH_PASSWORD: change-me
  # Replace before applying in production:
  #   openssl rand -base64 32
  DATABRIDGE_SESSION_SECRET: change-me-session-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: databridge-data
  namespace: databridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: databridge
  namespace: databridge
  labels:
    app.kubernetes.io/name: databridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: databridge
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databridge
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: databridge
          image: hkccr.ccs.tencentyun.com/buall/databridge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DATABRIDGE_ADDR
              value: ":8081"
            - name: DATABRIDGE_DB_PATH
              value: /data/databridge.db
            - name: DATABRIDGE_KEY_PATH
              value: /data/databridge.key
            - name: DATABRIDGE_PG_JOBS
              value: "4"
            - name: TZ
              value: Asia/Shanghai
            # Set to "true" when DataBridge is only accessed through HTTPS.
            - name: DATABRIDGE_COOKIE_SECURE
              value: "false"
          envFrom:
            - secretRef:
                name: databridge-auth
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: databridge-data
---
apiVersion: v1
kind: Service
metadata:
  name: databridge
  namespace: databridge
  labels:
    app.kubernetes.io/name: databridge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: databridge
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: databridge
  namespace: databridge
  annotations:
    # Uncomment and adjust for your Ingress controller / cert-manager setup.
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: databridge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: databridge
                port:
                  name: http
  # tls:
  #   - hosts:
  #       - databridge.example.com
  #     secretName: databridge-tls
